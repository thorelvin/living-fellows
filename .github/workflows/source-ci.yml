name: Source CI

on:
  push:
    # Living Fellows release branches are versioned independently from the
    # separate PZ Radio Link history retained in this repository.
    branches: ['living_fellows/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-only:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17.0.12'
      - name: Run source-only gates
        shell: pwsh
        run: ./scripts/Test-Source.ps1
