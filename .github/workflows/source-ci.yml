name: Source CI

on:
  push:
    # Release branches are where work actually lands, and the newest one is the
    # repository default. A wildcard keeps this working when the next release
    # branch is cut, rather than needing an edit every time.
    branches: ['release/**', main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-only:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17.0.12'
      - name: Run source-only gates
        shell: pwsh
        run: ./scripts/Test-Source.ps1
