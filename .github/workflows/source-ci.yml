name: Source CI

on:
  push:
    # `lf` is the release-ready default branch. `ci` is the integration branch
    # used to prove candidate changes before they are promoted to `lf`.
    branches: [lf, ci]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-only:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17.0.12'
      - name: Run source-only gates
        shell: pwsh
        run: ./scripts/Test-Source.ps1
