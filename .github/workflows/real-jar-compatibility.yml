name: Real Project Zomboid compatibility

on:
  workflow_dispatch:
    inputs:
      gameRoot:
        description: Absolute Project Zomboid 42.20.4 installation path on the trusted runner
        required: true
        default: 'C:\Program Files (x86)\Steam\steamapps\common\ProjectZomboid'
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  real-jar:
    runs-on: [self-hosted, Windows, living-fellows-pz]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Validate release tag
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          RELEASE_REF_NAME: ${{ github.ref_name }}
        run: |
          # Release tags name the Project Zomboid build they target:
          # v<VERSION>-pz<pinned game version>, e.g. v0.26.44-pz42.21.0.
          $version = (Get-Content -LiteralPath './VERSION.txt' -Raw).Trim()
          $game = (Get-Content -LiteralPath './tests/core/pz-runtime.json' -Raw |
            ConvertFrom-Json).gameVersion
          $expected = "v$version-pz$game"
          if ($env:RELEASE_REF_NAME -ne $expected) {
            throw "Release tag $env:RELEASE_REF_NAME does not match $expected"
          }
      - name: Run real-JAR and packaging gates
        shell: pwsh
        env:
          INPUT_GAME_ROOT: ${{ inputs.gameRoot }}
        run: |
          $gameRoot = $env:INPUT_GAME_ROOT
          if ([string]::IsNullOrWhiteSpace($gameRoot)) {
            $gameRoot = 'C:\Program Files (x86)\Steam\steamapps\common\ProjectZomboid'
          }
          ./scripts/Test-Project.ps1 -GameRoot $gameRoot
