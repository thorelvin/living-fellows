<text x="397.000" y="982.000" font-size="13">INNER DISC</text>
<text x="397.000" y="1022.000" font-size="13">Cut both dashed edges. Place INNER above OUTER; pin the centres.</text>
<text x="397.000" y="1044.000" font-size="13">Turn the inner disc until the named symbol points to the outer letter.</text>
<text x="397.000" y="1066.000" font-size="13">Read the inner letter beside the requested numbered window.</text>
<text x="397.000" y="1088.000" font-size="13">Example: DIAMOND to K, window 2 reads N. All machines use this mapping.</text>
